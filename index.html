<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة التطبيق الذكي</title>
    <style>
        /* تنسيق عام */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        /* حاوية الفيديو الرئيسية */
        .video-feed { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(180deg, #333, #000); }
        
        /* شريط المعلومات السفلي */
        .info-bar { position: absolute; bottom: 20px; left: 20px; right: 80px; }
        .username { font-weight: bold; margin-bottom: 5px; }
        .description { font-size: 0.9em; color: #ccc; }
        
        /* الأيقونات الجانبية */
        .actions { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .action-btn { font-size: 24px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 50%; cursor: pointer; }
        
        /* شريط التنقل السفلي */
        .nav-bar { position: absolute; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        
        /* زر التحديث */
        .update-btn { position: absolute; top: 10px; left: 10px; background: #ff4500; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- زر التحقق من التحديث -->
    <div class="update-btn" onclick="checkUpdate()">تحديث</div>

    <!-- شاشة عرض الفيديو -->
    <div class="video-feed">
        <h1>فيديو 1</h1>
        <p>محتوى الفيديو الخاص بك يظهر هنا</p>
    </div>

    <!-- معلومات الفيديو -->
    <div class="info-bar">
        <div class="username">@المستخدم_الرئيسي</div>
        <div class="description">تجربة واجهة التطبيق الأولى للنمو</div>
    </div>

    <!-- الأيقونات الجانبية -->
    <div class="actions">
        <div class="action-btn">❤️</div>
        <div class="action-btn">💬</div>
        <div class="action-btn">🔗</div>
    </div>

    <!-- شريط التنقل -->
    <div class="nav-bar">
        <div>🏠</div>
        <div>🔍</div>
        <div>➕</div>
        <div>👤</div>
    </div>

    <script>
        function checkUpdate() {
            alert("جاري التحقق من السيرفر... لا يوجد تحديث جديد حالياً.");
        }
    </script>
</body>
</html>
