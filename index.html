<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيديو - تطبيق</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* خلفية الفيديو */
        .video-container {
            height: 100vh;
            position: relative;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* overlay gradient */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.2));
            z-index: 2;
        }

        /* معلومات أسفل اليسار */
        .info-bar {
            position: absolute;
            bottom: 70px;
            left: 15px;
            right: 80px;
            z-index: 10;
        }

        .username {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .description {
            font-size: 15px;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .music {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #fff;
        }

        /* أزرار الجانب الأيمن */
        .actions {
            position: absolute;
            right: 12px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 10;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.8);
        }

        .action-btn i {
            font-size: 32px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .action-count {
            font-size: 13px;
            font-weight: 600;
        }

        /* شريط التنقل السفلي */
        .nav-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55px;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            font-size: 11px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item i {
            font-size: 26px;
            margin-bottom: 3px;
        }

        /* زر التحديث */
        .update-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 69, 0, 0.9);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* زر الإنشاء (وسط) */
        .create-btn {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ff0050, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 80, 0.4);
            margin-top: -25px;
            border: 4px solid #000;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- فيديو حقيقي (يمكنك تغييره) -->
        <video class="video-feed" autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/754/754-large.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="overlay"></div>

        <!-- زر التحديث -->
        <div class="update-btn" onclick="checkUpdate()">
            <i class="fas fa-sync-alt"></i>
            تحديث
        </div>

        <!-- معلومات الفيديو -->
        <div class="info-bar">
            <div class="username">@syrx_vox</div>
            <div class="description">تجربة مذهلة في إسطنبول 🌆🔥 ما رأيك في هذا المكان؟</div>
            <div class="music">
                <i class="fas fa-music"></i>
                <span>أغنية تركية - Ahmed K</span>
            </div>
        </div>

        <!-- أزرار التفاعل -->
        <div class="actions">
            <div class="action-btn" onclick="toggleLike(this)">
                <i class="fas fa-heart"></i>
                <span class="action-count">12.4K</span>
            </div>
            <div class="action-btn" onclick="openComments()">
                <i class="fas fa-comment-dots"></i>
                <span class="action-count">892</span>
            </div>
            <div class="action-btn" onclick="shareVideo()">
                <i class="fas fa-share"></i>
                <span class="action-count">مشاركة</span>
            </div>
            <div class="action-btn">
                <i class="fas fa-bookmark"></i>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <div class="nav-item active">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-search"></i>
            <span>بحث</span>
        </div>
        <div class="create-btn" onclick="createPost()">
            <i class="fas fa-plus"></i>
        </div>
        <div class="nav-item">
            <i class="fas fa-inbox"></i>
            <span>الوارد</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-user"></i>
            <span>أنا</span>
        </div>
    </div>

    <script>
        function checkUpdate() {
            const btn = document.querySelector('.update-btn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري التحقق...`;
            
            setTimeout(() => {
                btn.innerHTML = `<i class="fas fa-check"></i> محدث`;
                setTimeout(() => {
                    btn.innerHTML = `<i class="fas fa-sync-alt"></i> تحديث`;
                }, 2000);
            }, 1500);
        }

        function toggleLike(el) {
            const icon = el.querySelector('i');
            if (icon.classList.contains('fa-heart')) {
                icon.classList.remove('fa-heart');
                icon.classList.add('fa-solid', 'fa-heart');
                icon.style.color = '#ff2d55';
            } else {
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-heart');
                icon.style.color = '';
            }
        }

        function openComments() {
            alert("تم فتح قسم التعليقات (سيتم تطويره لاحقاً)");
        }

        function shareVideo() {
            alert("تم نسخ رابط المشاركة!");
        }

        function createPost() {
            alert("فتح صفحة إنشاء محتوى جديد");
        }

        // دعم الـ Swipe (تغيير فيديو وهمي)
        let currentVideo = 1;
        document.addEventListener('touchstart', handleSwipe);

        function handleSwipe(e) {
            const startY = e.touches[0].clientY;
            
            document.addEventListener('touchend', function end(e) {
                const endY = e.changedTouches[0].clientY;
                if (startY - endY > 80) {
                    // swipe up
                    alert("الفيديو التالي");
                }
                document.removeEventListener('touchend', end);
            });
        }
    </script>
</body>
</html>
