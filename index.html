<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق النمو الذكي</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; }
        
        /* تأثير التدرج للواجهة */
        .app-container { height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at top, #1c1c1c, #000); }
        
        /* شريط علوي أنيق */
        .top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .update-badge { background: linear-gradient(45deg, #ff4500, #ff8c00); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; color: white; }
        
        /* منطقة المحتوى */
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 25px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 80%; }
        
        /* أيقونات جانبية بأسلوب احترافي */
        .side-actions { position: absolute; right: 15px; top: 30%; display: flex; flex-direction: column; gap: 25px; }
        .action-icon { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 50%; border: 1px solid #333; }
        
        /* شريط تنقل سفلي زجاجي */
        .bottom-nav { height: 70px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <span>تطبيقي الخاص</span>
            <button class="update-badge" onclick="alert('التطبيق يعمل بكفاءة - الإصدار 1.0')">مُحدث 1.0</button>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>جاهز للنمو؟</h2>
                <p>هذا التصميم هو مجرد البداية، في FlutterFlow ستصمم ما هو أجمل بكثير.</p>
            </div>
        </div>

        <div class="side-actions">
            <div class="action-icon">❤️</div>
            <div class="action-icon">💬</div>
            <div class="action-icon">🔗</div>
        </div>

        <div class="bottom-nav">
            <div>🏠</div>
            <div>🔍</div>
            <div>➕</div>
            <div>👤</div>
        </div>
    </div>

</body>
</html>
